# Fastrak Mobile Lab — Weekly SEO Automation
#
# Required GitHub Secrets (Settings -> Secrets and variables -> Actions):
#   WP_USER         — WordPress username
#   WP_APP_PASSWORD — WordPress Application Password
#   WP_SITE         — Full site URL, no trailing slash (e.g. https://fastrakmobilelab.com)
#
# Schedule: every Sunday at 12:00 UTC (8:00 AM Eastern)
# Reports committed back to repo under seo_reports/

name: Weekly SEO Audit

on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:

jobs:
  seo-audit:
    name: SEO Audit + Competitor Snapshot
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Run SEO audit
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_SITE: ${{ secrets.WP_SITE }}
        run: python tools/seo_audit.py

      - name: Run competitor tracker
        env:
          WP_SITE: ${{ secrets.WP_SITE }}
        run: python tools/competitor_tracker.py --output seo_reports/
        continue-on-error: true

      - name: Commit reports if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seo_reports/
          git diff --quiet --cached || git commit -m "SEO auto-report $(date +%Y-%m-%d) [skip ci]"
          git push
